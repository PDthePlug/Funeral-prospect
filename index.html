<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="Independent PD Connect funeral-service redesign concepts"><title>PD Connect Funeral Prospect Lab</title><style>
:root{--ink:#18342f;--muted:#6c7873;--line:#dfe9e4;--accent:#2d6a61;--tint:#edf7f3;--soft:#f8fbfa;--wa:#167648}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#fff;padding-bottom:0}a,button,input,select,textarea{font:inherit;color:inherit}.notice{font-size:8px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:7px 14px;background:#f3f7f5;border-bottom:1px solid var(--line);color:#74827b}.shell{max-width:1180px;margin:auto;padding:0 22px}.top{height:74px;display:flex;align-items:center;gap:20px;position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.top .shell{display:flex;align-items:center;width:100%}.brand{display:flex;gap:10px;align-items:center}.mark{width:40px;height:40px;border-radius:14px;background:var(--tint);display:grid;place-items:center;color:var(--accent);font-family:Georgia,serif;font-weight:700}.brand strong,.brand small{display:block}.brand strong{font-size:13px}.brand small{font-size:7px;letter-spacing:.12em;color:var(--muted);margin-top:3px}.nav{margin-left:auto;display:flex;gap:4px}.nav a,.btn{text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:11px 14px;font-size:10px;font-weight:800;display:inline-flex;justify-content:center;align-items:center}.nav a{border-color:transparent}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.wa{background:#e8f7ef;color:var(--wa);border-color:#c7e6d4}.hero{background:linear-gradient(140deg,#fff,var(--soft));padding:78px 0 58px}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:38px;align-items:center}.eyebrow{font-size:9px;letter-spacing:.16em;font-weight:800;color:var(--accent)}h1,h2{font-family:Georgia,'Times New Roman',serif;letter-spacing:-.04em}h1{font-size:clamp(52px,7vw,86px);line-height:.95;margin:14px 0 20px}h1 em{color:var(--accent);font-style:normal}.hero p{font-size:15px;line-height:1.7;color:var(--muted);max-width:650px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:26px}.visual{min-height:480px;border-radius:34px;background:radial-gradient(circle at 70% 20%,rgba(202,165,87,.22),transparent 22%),linear-gradient(145deg,var(--tint),#fff);position:relative;overflow:hidden}.visual:before,.visual:after{content:'';position:absolute;left:-8%;right:-8%;border-radius:50% 50% 0 0}.visual:before{height:48%;bottom:-8%;background:color-mix(in srgb,var(--accent) 12%,transparent);transform:rotate(-4deg)}.visual:after{height:37%;bottom:-14%;background:color-mix(in srgb,var(--accent) 17%,transparent);transform:rotate(5deg)}.arch{position:absolute;width:210px;height:270px;border:16px solid color-mix(in srgb,var(--accent) 65%,transparent);border-bottom:0;border-radius:120px 120px 0 0;left:50%;top:50%;transform:translate(-50%,-45%)}.section{padding:78px 0}.section.alt{background:var(--soft)}.section h2{font-size:clamp(38px,5vw,58px);margin:8px 0 12px}.lead{color:var(--muted);line-height:1.7;max-width:720px}.choice,.cards,.contact{display:grid;gap:10px}.choice{grid-template-columns:repeat(3,1fr);margin-top:-26px;position:relative;z-index:4}.choice a,.card,.contact>article{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;text-decoration:none;box-shadow:0 14px 38px rgba(46,79,67,.06)}.choice small,.card small{display:block;font-size:8px;color:var(--accent);font-weight:800;letter-spacing:.1em}.choice strong{display:block;margin-top:5px}.cards{grid-template-columns:repeat(4,1fr);margin-top:28px}.card{min-height:205px}.card b{font-size:9px;color:var(--accent)}.card h3{margin:38px 0 8px;font-size:18px}.card p{font-size:10px;color:var(--muted);line-height:1.65}.help{display:grid;grid-template-columns:.9fr 1.1fr;gap:46px;align-items:start}.helpbox{background:var(--tint);border-radius:26px;padding:30px;position:sticky;top:96px}.steps{display:grid;gap:9px}.steps article{border:1px solid var(--line);border-radius:17px;padding:18px;display:grid;grid-template-columns:34px 1fr;gap:10px}.steps b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--accent);font-size:9px}.steps h3{font-size:14px;margin:0 0 4px}.steps p{margin:0;font-size:10px;color:var(--muted);line-height:1.55}.formwrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:42px;align-items:center}.form{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 18px 48px rgba(45,77,66,.07)}label{display:grid;gap:6px;font-size:10px;font-weight:700;margin-top:12px}input,select,textarea{width:100%;border:1px solid #d2ded8;border-radius:12px;padding:12px;background:#fbfdfc;outline:0;min-height:46px}textarea{resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.error{display:none;margin-top:10px;padding:10px;border-radius:10px;background:#fff1ee;color:#8e493e;font-size:10px}.contact{grid-template-columns:1fr 1fr;margin-top:26px}.contact a,.contact span{display:block;margin-top:7px}.contact a{font-weight:800;color:var(--accent);text-decoration:none}.contact span{font-size:10px;color:var(--muted)}footer{background:#eef5f1;border-top:1px solid var(--line);padding:42px 0 80px}footer span{display:block;color:var(--muted);font-size:9px;margin-top:5px}.directory{padding:70px 0 100px}.directory h1{font-size:clamp(44px,6vw,68px)}.directory-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:28px}.directory-grid a{border:1px solid var(--line);border-radius:18px;padding:20px;text-decoration:none;background:#fff}.directory-grid strong,.directory-grid span,.directory-grid b{display:block}.directory-grid span{font-size:10px;color:var(--muted);margin:4px 0}.directory-grid b{font-size:9px;color:var(--accent)}.dock{display:none}@media(max-width:850px){.nav{display:none}.hero-grid,.help,.formwrap,.contact{grid-template-columns:1fr}.visual{min-height:340px}.choice{grid-template-columns:1fr;margin-top:12px}.cards{grid-template-columns:1fr 1fr}.helpbox{position:static}}@media(max-width:600px){body{padding-bottom:70px}.top{height:62px}.shell{padding:0 15px}.hero{padding:48px 0 30px}h1{font-size:48px}.hero p{font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .wa{grid-column:1/-1}.visual{min-height:285px}.section{padding:56px 0}.cards,.row,.directory-grid{grid-template-columns:1fr}.form{padding:21px}.dock{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:7px 7px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.dock a{min-height:48px;border-radius:12px;background:var(--tint);display:grid;place-items:center;text-decoration:none;font-size:9px;font-weight:800;color:var(--accent)}.dock a:nth-child(2){background:#e8f7ef;color:var(--wa)}}
</style></head><body><div id="app"></div><script>
const app=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),digits=s=>String(s||'').replace(/\D/g,''),intl=s=>{const d=digits(s);return d.startsWith('0')?'27'+d.slice(1):d},slug=location.pathname.split('/').filter(Boolean)[0]||'';
fetch('/prospects.json').then(r=>r.json()).then(P=>{const p=P.find(x=>x.slug===slug);p?render(p):directory(P)}).catch(()=>app.innerHTML='<main class="shell section"><h2>Preview unavailable.</h2><p class="lead">Please refresh and try again.</p></main>');
function directory(P){app.innerHTML=`<div class="notice">PD Connect · independent prospect lab · noindex</div><main class="shell directory"><span class="eyebrow">FUNERAL SERVICES PROSPECT BATCH</span><h1>10 independent redesign concepts.</h1><p class="lead">Mobile-first funeral-service concepts created from public business information without inventing policy terms or regulated product claims.</p><div class="directory-grid">${P.map(x=>`<a href="/${x.slug}/"><strong>${esc(x.name)}</strong><span>${esc(x.area)}</span><b>Open concept →</b></a>`).join('')}</div></main>`}
function render(p){const waNumber=p.wa_display||p.phone,wa=u=>`https://wa.me/${intl(waNumber)}?text=${encodeURIComponent(u)}`,call=`tel:${digits(p.phone)}`,maps=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.address)}`,find=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+' '+p.area)}`;document.title=p.name+' — Digital Concept';const services=['Funeral assistance','Funeral arrangements','Family consultations','Service enquiries'];app.innerHTML=`<div class="notice">Independent PD Connect redesign concept · not the official ${esc(p.name)} website</div><div class="top"><div class="shell"><div class="brand"><div class="mark">${esc(p.name[0])}</div><div><strong>${esc(p.name)}</strong><small>${esc(p.area.toUpperCase())}</small></div></div><nav class="nav"><a href="#services">Services</a><a href="#help">Funeral help</a><a href="#enquire">Enquire</a><a href="#contact">Contact</a></nav><div style="margin-left:auto;display:flex;gap:7px"><a class="btn" href="${call}">Call</a><a class="btn wa" target="_blank" rel="noreferrer" href="${wa('Hello '+p.name+', I would like assistance please.')}">WhatsApp</a></div></div></div><main><section class="hero"><div class="shell hero-grid"><div><span class="eyebrow">${esc(p.area.toUpperCase())}</span><h1>Here when your family needs a clear next step<em>.</em></h1><p>Funeral support should be easy to reach. This concept gives families a direct path to assistance, arrangements, WhatsApp and directions.</p><div class="actions"><a class="btn primary" href="#help">A loved one has passed</a><a class="btn" href="#enquire">Request an enquiry</a><a class="btn wa" target="_blank" rel="noreferrer" href="${wa('Hello '+p.name+', I would like to enquire about funeral services.')}">WhatsApp</a></div></div><div class="visual"><div class="arch"></div></div></div></section><div class="shell choice"><a href="#help"><small>RIGHT NOW</small><strong>I need funeral help</strong></a><a href="#enquire"><small>PLAN AHEAD</small><strong>I want to discuss arrangements</strong></a><a href="#contact"><small>CONTACT</small><strong>I want to speak to the team</strong></a></div><section class="section alt" id="services"><div class="shell"><span class="eyebrow">HOW WE CAN HELP</span><h2>One family. One clear next step.</h2><p class="lead">The service language stays deliberately conservative until the business confirms its exact packages and approved customer wording.</p><div class="cards">${services.map((s,i)=>`<article class="card"><b>0${i+1}</b><h3>${s}</h3><p>Speak directly to the team to confirm availability, arrangements and costs that apply to your family.</p></article>`).join('')}</div></div></section><section class="section" id="help"><div class="shell help"><div class="helpbox"><span class="eyebrow">FUNERAL ASSISTANCE</span><h2>Someone has passed?</h2><p class="lead">Start with the situation. The team can confirm the immediate next step.</p><div class="actions"><a class="btn primary" href="${call}">Call ${esc(p.phone)}</a><a class="btn wa" target="_blank" rel="noreferrer" href="${wa('Hello '+p.name+', a loved one has passed and I need funeral assistance.')}">WhatsApp</a></div></div><div class="steps"><article><b>01</b><div><h3>Tell us what happened</h3><p>Share where the deceased is and the town or suburb.</p></div></article><article><b>02</b><div><h3>Confirm the family contact</h3><p>Provide one reliable number for coordination.</p></div></article><article><b>03</b><div><h3>Discuss the arrangements</h3><p>Confirm what is needed and what has already been arranged.</p></div></article><article><b>04</b><div><h3>Get the next step clearly</h3><p>The team confirms where to go and what to have ready.</p></div></article></div></div></section><section class="section alt" id="enquire"><div class="shell formwrap"><div><span class="eyebrow">START AN ENQUIRY</span><h2>Tell us what you need.</h2><p class="lead">This concept prepares a WhatsApp conversation instead of storing customer information.</p></div><form class="form" id="f"><span class="eyebrow">QUICK ENQUIRY</span><h3 style="font-size:26px;margin:7px 0 18px">Three details to start.</h3><div class="row"><label>Your name<input name="name" autocomplete="name" placeholder="Full name"></label><label>Mobile number<input name="mobile" inputmode="tel" autocomplete="tel" placeholder="082 123 4567"></label></div><label>What do you need?<select name="need"><option value="">Choose one</option><option>Funeral assistance</option><option>Funeral arrangements</option><option>Funeral service quote</option><option>Plan-ahead enquiry</option><option>General enquiry</option></select></label><label>Anything else?<textarea name="message" rows="3" placeholder="Add useful context"></textarea></label><div class="error" id="err">Please add your name, a valid mobile number and what you need.</div><button class="btn primary" style="width:100%;margin-top:14px" type="submit">Continue on WhatsApp</button><span style="display:block;font-size:8px;color:var(--muted);margin-top:10px">${esc(p.wa_status)}</span></form></div></section><section class="section" id="contact"><div class="shell"><span class="eyebrow">CONTACT</span><h2>Close to the people you serve.</h2><div class="contact"><article><strong>${esc(p.name)}</strong><span>${esc(p.address)}</span><a href="${call}">${esc(p.phone)}</a>${p.alt?`<a href="tel:${digits(p.alt)}">${esc(p.alt)}</a>`:''}${p.office?`<a href="tel:${digits(p.office)}">${esc(p.office)}</a>`:''}<span>${esc(p.wa_status)}</span></article><article><strong>Get directions</strong><span>Open Maps and route from the customer’s current location when available.</span><a target="_blank" rel="noreferrer" href="${maps}">Open directions ↗</a><a target="_blank" rel="noreferrer" href="${find}">Find on Maps ↗</a></article></div></div></section></main><footer><div class="shell"><strong>${esc(p.name)}</strong><span>Independent digital concept prepared by PD Connect from publicly available business information. Not commissioned or approved by ${esc(p.name)}.</span></div></footer><div class="dock"><a href="${call}">Call</a><a target="_blank" rel="noreferrer" href="${wa('Hello '+p.name+', I need assistance please.')}">WhatsApp</a><a href="#enquire">Enquire</a></div>`;document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.currentTarget),n=String(d.get('name')||'').trim(),m=String(d.get('mobile')||'').trim(),need=String(d.get('need')||'').trim(),msg=String(d.get('message')||'').trim(),er=document.getElementById('err');if(!n||digits(m).length<9||!need){er.style.display='block';return}er.style.display='none';open(wa(`Hello ${p.name}, my name is ${n}. My contact number is ${m}. I need help with: ${need}.${msg?' '+msg:''}`),'_blank')})}
</script></body></html>
